[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "khaos_attribution"
version = "0.5.0"
description = "JSON schemas and validators for artist attribution: provenance records and model cards."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BlurredEdgeVR" }]
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
khaos_attribution = ["schemas/*.json"]
