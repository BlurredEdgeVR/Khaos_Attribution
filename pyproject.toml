[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "khaos_attribution"
version = "0.14.4"
description = "JSON schemas and validators for artist attribution: provenance records and model cards."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BlurredEdgeVR" }]
dependencies = [
    "jsonschema>=4.18",
    # blend.py and embedding.py: the estimator math and embedding contract
    # are shared by the Workshop and the Listening Space — one
    # implementation, versioned with the schemas it feeds.
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7", "soundfile>=0.12"]  # fingerprint survival tests decode real audio

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
khaos_attribution = ["schemas/*.json", "legacy_watermark_ids.json"]
